name: Build NetSpoof v5 APK

on:
  push:
    branches: [ "claude/custom-root-detection-ambulance-ewvq8w", "main" ]
    paths:
      - 'NetSpoofModule_v5/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NetSpoofModule_v5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetSpoofV5-release
          path: NetSpoofModule_v5/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
