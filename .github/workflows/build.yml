name: Build NetSpoof v5 APK

on:
  push:
    branches: [ "main", "claude/custom-root-detection-ambulance-ewvq8w" ]
    paths:
      - 'NetSpoofModule_v5/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x NetSpoofModule_v5/gradlew

      - name: Build Release APK
        run: |
          cd NetSpoofModule_v5
          ./gradlew assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NetSpoofV5-APK
          path: NetSpoofModule_v5/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 90
