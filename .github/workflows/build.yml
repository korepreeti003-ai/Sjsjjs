name: Build NetSpoof v5 APK

on:
  push:
    branches: [ "main", "claude/custom-root-detection-ambulance-ewvq8w" ]
    paths:
      - 'NetSpoofModule_v5/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Download and install Gradle 8.2
        run: |
          wget -q https://services.gradle.org/distributions/gradle-8.2-bin.zip -O /tmp/gradle-8.2-bin.zip
          unzip -q /tmp/gradle-8.2-bin.zip -d /opt/gradle
          export PATH="/opt/gradle/gradle-8.2/bin:$PATH"
          echo "/opt/gradle/gradle-8.2/bin" >> $GITHUB_PATH

      - name: Regenerate Gradle wrapper
        working-directory: NetSpoofModule_v5
        run: |
          /opt/gradle/gradle-8.2/bin/gradle wrapper --gradle-version 8.2 --distribution-type bin
          chmod +x gradlew
          echo "--- Wrapper jar contents ---"
          unzip -l gradle/wrapper/gradle-wrapper.jar | head -10

      - name: Build Release APK
        working-directory: NetSpoofModule_v5
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NetSpoofV5-APK
          path: NetSpoofModule_v5/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 90
