name: Build NetSpoof v5 APK

on:
  push:
    branches: [ "claude/custom-root-detection-ambulance-ewvq8w", "main" ]
    paths:
      - 'NetSpoofModule_v5/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: NetSpoofModule_v5

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Rename APK
        run: |
          mkdir -p ../output
          cp app/build/outputs/apk/release/app-release-unsigned.apk ../output/NetSpoofV5.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: NetSpoofV5-APK
          path: output/NetSpoofV5.apk
          retention-days: 90

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v5.0-${{ github.run_number }}
          name: "NetSpoof v5.0 — Build ${{ github.run_number }}"
          body: |
            ## NetSpoof v5 — All-in-One LSposed Module

            **Install karke LSposed mein enable karo, phir target app select karo.**

            Root + Zygisk + LSposed — sab hide. Phone identity spoof.
          files: output/NetSpoofV5.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
